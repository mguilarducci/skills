# Default path-to-production flow.
# A repository can replace it entirely with its own .bonde/flow.yaml (same shape).
# Order is the list order: phases in order, stages in order within each phase.
# A stage's `command` is what the person runs to start the step that ends in that stage.
phases:
  - name: intent
    stages:
      - name: intent-recorded
        command: /bonde-intent-create
      - name: intent-enriched
        command: /bonde-intent-enrichment
  - name: planning
    stages:
      - name: brainstormed
        command: /bonde-brainstorming
      - name: planned
        command: /bonde-writing-plans
  - name: building
    stages: []
  - name: reviewing
    stages: []
  - name: publishing
    stages: []
